# ============================================
# Database Configuration
# Uses environment variables for credentials.
# Set DB_URL, DB_USERNAME, DB_PASSWORD in your
# environment or backend/.env (never commit .env).
# ============================================

# Load backend/.env when running locally (mvn spring-boot:run).
# Optional, so deployments without the file still start; real OS
# environment variables always take precedence over these values.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration
# Defaults to the local frontend origin so a missing CORS_ALLOWED_ORIGINS
# cannot stop the app from starting (Render sets the real value).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Server Configuration
server.port=8080

# ML Service Configuration
ml.service.url=${ML_SERVICE_URL:http://localhost:5000}
ml.service.timeout=${ML_SERVICE_TIMEOUT:5000}

# Seed configuration: set to true to force seeding on startup (e.g., when deploying to NeonDB)
# Set environment variable `APP_SEED_ENABLED=true` in Render to enable seeding on first deploy
app.seed.enabled=${APP_SEED_ENABLED:true}
